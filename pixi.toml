[workspace]
name = "bun-test-utils"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Default-environment tooling used by the pre-commit hooks.
[dependencies]
actionlint = ">=1.7.12,<2"

# Every shared library Playwright's chromium and firefox builds link against on
# linux-64 (playwright nativeDeps, ubuntu22.04 lists), mapped to conda-forge
# names. WebKit is deliberately absent: its gtk4/gstreamer stack pulls system
# packages that cannot be installed on the offline sandbox (no sudo), and the
# repo's browser tests only exercise chromium and firefox anyway.
#
# Pruned 2026-10-09 (task_072) with per-removal evidence, after headed runs
# were retired (ADR 0030). Removed packages: xorg-xvfb-server (only the headed
# path used Xvfb), ffmpeg (no test records video; task_054 re-adds it for
# Playwright video wiring), xorg-libxtst (nothing links it: not the chromium
# or firefox binaries, not libmozgtk, not libgtk-3; its consumer was Xvfb), and
# the GL dispatch group libgl/libegl/libglx/libopengl/libgles (deleting those
# .so files from the environment left ldd at zero not-found for chrome,
# chrome-wrapper, firefox and libmozgtk — chromium ships and loads its own
# libEGL/libGLESv2). Removed redundant entries kept in the environment by
# gtk3's own conda depends: gdk-pixbuf, xorg-libxcursor, xorg-libxinerama
# (the environment-level pin went with it), xorg-libxrender (also linked by
# chromium itself, so its entry stays for that reason).
[feature.browser.dependencies]
# --- chromium ---
alsa-lib = "*"
at-spi2-atk = "*"
at-spi2-core = "*"
atk = "*"
cairo = "*"
dbus = "*"
libcups = "*"
libdrm = "*"
libgbm = "*"
glib = "*"
libxcb = "*"
libxkbcommon = "*"
nspr = "*"
nss = "*"
pango = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcomposite = "*"
xorg-libxdamage = "*"
xorg-libxext = "*"
xorg-libxfixes = "*"
xorg-libxi = "*"
xorg-libxrandr = "*"
xorg-libxrender = "*"
# --- firefox ---
# The firefox binary dlopens libmozgtk.so, which links libgtk-3.so.0; a
# headless launch fails with "XPCOMGlueLoad error ... libgtk-3.so.0" when gtk3
# is absent (measured 2026-10-09 with the environment pruned). gtk3's conda
# depends pull gdk-pixbuf, xorg-libxcursor and xorg-libxinerama into the
# environment, so no separate entries for them are needed.
fontconfig = "*"
freetype = "*"
gtk3 = "*"
# --- runtime glue ---
libgcc = "*"
# --- fonts for headless rendering ---
font-ttf-dejavu = "*"
font-ttf-inconsolata = "*"

# Playwright's browser binaries live outside the prefix; point the loader at
# this environment's lib/ first (system defaults stay in the search path).
[feature.browser.activation]
scripts = ["scripts/browser-activate.sh"]

[environments.browser]
features = ["browser"]
solve-group = "browser"
