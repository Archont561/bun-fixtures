[workspace]
name = "bun-test-utils"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Default-environment tooling used by the pre-commit hooks.
[dependencies]
actionlint = ">=1.7.12,<2"

# Every shared library Playwright's chromium and firefox builds link against on
# linux-64 (playwright nativeDeps, ubuntu22.04 lists), mapped to conda-forge
# names. WebKit is deliberately absent: its gtk4/gstreamer stack pulls system
# packages that cannot be installed on the offline sandbox (no sudo), and the
# repo's browser tests only exercise chromium anyway.
[feature.browser.dependencies]
# --- chromium ---
alsa-lib = "*"
at-spi2-atk = "*"
at-spi2-core = "*"
atk = "*"
cairo = "*"
dbus = "*"
libcups = "*"
libdrm = "*"
libgbm = "*"
glib = "*"
libxcb = "*"
libxkbcommon = "*"
nspr = "*"
nss = "*"
pango = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcomposite = "*"
xorg-libxdamage = "*"
xorg-libxext = "*"
xorg-libxfixes = "*"
xorg-libxrandr = "*"
# --- firefox ---
# Floor at 7 for libvpx: Playwright's video recorder only writes .webm, and the
# 4.3.2 build this lockfile carried has no VP8/VP9 encoder at all, so video
# recording failed silently. 7+ on conda-forge builds against libvpx.
ffmpeg = ">=7,<10"
fontconfig = "*"
freetype = "*"
gdk-pixbuf = "*"
gtk3 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxrender = "*"
xorg-libxtst = "*"
# --- GL dispatch: chromium dlopens libEGL/libGLESv2 for its GPU stack ---
libgl = "*"
libegl = "*"
libglx = "*"
libopengl = "*"
libgles = "*"
# --- headed browsers: an X display for non-headless runs ---
# conda-forge's xorg-xvfb-server provides Xvfb; its recipe asserts
# ${PREFIX}/bin/Xvfb, so Xvfb lands on PATH inside the environment. The CDT
# package xorg-x11-server-xvfb-cos7-x86_64 is deliberately not used: it installs
# xvfb-run into x86_64-conda-linux-gnu/sysroot/usr/bin, which is off PATH and is
# meant for recipe build sections rather than runtime use.
# Restored bundles need two repairs before Xvfb starts, applied by
# scripts/browser-activate.sh: the keymap data links, and the staging-prefix
# link that Xvfb's binary expects. Without them it exits with "Failed to compile
# keymap". With them, headed Chromium rendered on a private display in this
# sandbox (packages/browser/tests/headed-chromium.test.ts). Unverified: whether a
# fresh conda-forge install needs the repairs, because conda.anaconda.org is
# unreachable from the sandbox.
xorg-xvfb-server = "*"
# --- runtime glue ---
libgcc = "*"
# --- fonts for headless rendering ---
font-ttf-dejavu = "*"
font-ttf-inconsolata = "*"

# Playwright's browser binaries live outside the prefix; point the loader at
# this environment's lib/ first (system defaults stay in the search path). The
# same script applies the Xvfb repairs for restored bundles (see above).
[feature.browser.activation]
scripts = ["scripts/browser-activate.sh"]

# Start the X server for headed browsers: `pixi run -e browser xvfb &`.
[feature.browser.tasks]
xvfb = "sh scripts/xvfb.sh"

[environments.browser]
features = ["browser"]
solve-group = "browser"

[environments.browser.dependencies]
xorg-libxinerama = ">=1.1.6,<2"
