  - id: task_063
    title: "Regular test path: a teardown error in the finally unwind replaces the
      setup error"
    description: >-
      Found while fixing task_059, by probe. The regular fixture-aware test path
      in packages/core/src/plugin.ts runs unwind(testStack) in a finally block,
      so a teardown error replaces the error already in flight: a body throwing
      "body assertion failed" is reported as "first teardown failed", a later
      setup throwing "second setup failed" is masked the same way, and a
      property throwing "property violated for 6" is reported as "teardown
      invariant broken". ctx.iterate has the same shape, so every PBT sample and
      shrink step behaves the same way. openFixtures (task_059, PR #36) keeps
      the setup error but drops the teardown error, so the two paths disagree
      and neither shows both.


      ADR 0025 settles the precedence: the error that started the failure is the
      one thrown, on the regular path, in ctx.iterate, and in openFixtures;
      every losing teardown error is attached to the thrown error as an
      enumerable own property "suppressed: Error[]", in the order thrown,
      keeping the original objects and appending to any existing suppressed. If
      the thrown value is not an object nothing is attached, and that gap is
      recorded in the ADR. unwind attaches every error it does not throw, so
      close(), teardownFile and teardownSession throw the same error as before
      plus suppressed, and the session-exit warning carries the suppressed
      messages because that path is silent by default. A passing body or sample
      whose teardown throws still fails with that teardown error. openFixtures
      attaches its cleanup errors to the setup error instead of dropping them,
      which reverses the deliberate drop merged in PR #36 — recorded in the ADR
      rather than silently reverted. No diagnostic code is added, errors are
      never wrapped in AggregateError, and no message, class, or code changes.


      Acceptance evidence (2026-10-08, bun 1.4.2):

      - Red, in-process (src reverted, tests kept):
      packages/core/tests/plugin.test.ts 31 pass / 4 fail. The iterate case
      reported "teardown of flaky failed" where the sample had thrown "sample
      failed"; the three suppressed assertions saw undefined; the non-object
      case saw the teardown Error instead of the thrown string.

      - Red, e2e: packages/core/e2e/bdd/features.test.ts 95 pass / 2 fail — both
      new scenarios printed only "first teardown failed".
      packages/pbt/e2e/bdd/features.test.ts 9 pass / 1 fail — the property run
      printed "teardown invariant broken" and never "property violated for 6".

      - Green: bun test 397 pass / 8 skip / 0 fail across 405 tests in 48 files
      (was 370/8/0 across 378 tests); the 8 skips are the unchanged Playwright
      scenarios. lint clean 138 files; typecheck 19/19; build 10/10.

      - The rule lives once, in runWithUnwind and attachSuppressed directly
      below unwind in packages/core/src/plugin.ts, and is shared by makeTest,
      ctx.iterate, openFixtures, close(), teardownFile and teardownSession.

      - Bun prints an enumerable suppressed for async failures, including on a
      nested cause, so the losing teardown error is visible in plain bun test
      output; makeTest always wraps the body in an async function, so a
      synchronous user callback is printed too.
    source_links: []
    status: done
    priority: P3
    labels:
      - fixtures
      - testing
    repo_targets:
