    acceptance_criteria:
      - New ADR superseding ADR 0011 is written and accepted, recording BOTH the
        rebrand and the single-published-package architecture reversal
      - Core package renamed (directory + package.json) and every existing
        workspace package's internal name updated to @bun-test-utils/* scope
      - The fast-check package specifically is renamed to pbt (directory,
        package.json name, docs, test file names) while the third-party
        fast-check library dependency it wraps keeps its own name
      - All hardcoded string literals (error prefixes, CLI preload path, env var
        names) referencing the old name are updated or deliberately kept for
        compat with a documented reason
      - Root tsconfig/bunfig/turbo/biome configs, root README, and docs site
        reflect the new name
      - GitHub repository rename and git remote URL update confirmed with the
        repository owner, not performed unilaterally
      - Full lint + typecheck + test + docs:build pass after the rename
