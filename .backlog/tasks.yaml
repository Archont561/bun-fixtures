  - id: task_037
    title: Dogfood test.extend in capability-pack unit suites
    description: >-
      DONE. Converted the std, dom, vcr, snapshot and browser unit suites from
      fixture.setup(fn, { testFile: import.meta.path }) to idiomatic
      test.extend({ ... }) composition with context injection. 29 of the 31
      hand-driven .setup() call sites are gone.


      Board-vs-tree finding: pbt was ALREADY converted before this task
      (packages/pbt/tests/index.test.ts composes base.extend(fixtures) against
      tests/fixtures.ts, zero .setup() calls). Verified, not re-done; only its
      README gained the link line.


      Counts (tests / expect() calls), before -> after: std 3/12 -> 7/21; dom
      2/6 -> 4/8; vcr 7/27 -> 9/30; snapshot 9/22 -> 17/23; browser 10/21 ->
      17/24; pbt 8/483 unchanged. Repo suite 303 pass/3 skip -> 321 pass/8 skip,
      0 fail. Assertion coverage rose in every converted package; the 5 new
      skips are all Playwright-gated.


      Technique: teardown runs after the body returns, so teardown assertions
      live in the following test via module-scope breadcrumbs (the pattern
      already used by tests/conformance/std.test.ts). vcr and snapshot
      additionally bind their suite to a scratch test file with
      createTest(<path>) so the __cassettes__/ and __snapshots__/ conventions
      resolve into a temp dir: idiomatic and hermetic. Letting the real testFile
      drive those writes was measured and rejected — it is self-poisoning (run 1
      passes, run 2 fails on an unchanged tree, because snapshot asserts
      existsSync(path) === false) and it leaves untracked files in the repo. vcr
      and browser also override a fixture key with an added deps entry so an
      env-setting fixture builds before the fixture that reads it and tears down
      after it.


      TWO DELIBERATE EXCEPTIONS remain on direct .setup(), both commented in
      place, neither for convenience:

      1. packages/vcr/tests/cassette.test.ts — 'replay mode without a cassette'
      asserts a failure raised during fixture SETUP. A test whose setup throws
      is a failing test, so the throw cannot be observed from inside an
      engine-driven body.

      2. packages/browser/tests/playwright.test.ts — 'session-scoped browser
      closes when its scope ends'. The browser is session-scoped, so it closes
      when the session ends, not when a test ends; bringing that teardown
      forward requires driving the fixture directly.


      Trust anchors untouched as specified: packages/core/tests and every
      e2e/bdd harness are unchanged.


      PLAYWRIGHT SLICE: the 8 Playwright tests skip locally (playwright is an
      optionalDependency and chromium is not installed here), so that file was
      committed separately as lint/typecheck-only evidence. CI closed the gap:
      .github/workflows/ci.yml installs chromium-headless-shell and then runs
      bun run test:all, and the Test job passed on PR #22 (run 37516863606,
      52s). The converted Playwright suite is therefore genuinely exercised on
      real Chromium, not merely compiled.


      Follow-up recorded as task_045 (base-dir override vs exporting createTest
      from the public wrapper).
