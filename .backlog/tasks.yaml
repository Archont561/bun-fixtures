  - id: task_070
    title: conda-forge xorg-xvfb-server displaces the xkeyboard-config share/X11/xkb
      link (rattler clobbering)
    description: "xkeyboard-config 2.48 installs its data under
      share/xkeyboard-config-2 and links share/X11/xkb to it. xorg-xvfb-server
      21.1.25 ships share/X11/xkb/compiled/, so rattler's rename-on-clobber
      moves the link to __clobbers__/xkeyboard-config/share/X11/xkb, and Xvfb
      finds no keymap rules. Verified in the restored bundle only. A fresh
      conda-forge install of this lock is unchecked, because conda.anaconda.org
      is unreachable from the sandbox. The six data links in
      scripts/browser-activate.sh repair it. Next: check a fresh install, then
      file upstream (conda-forge feedstock or rattler clobber handling). Filing
      needs the user's approval."
