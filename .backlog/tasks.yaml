  - id: task_011
    title: Implement @bun-fixture/std standard built-in fixtures (tmpdir, env, stdio)
    description: "Provide zero-dependency standard fixtures for filesystem temporary
      scratchpads (tmpdir), environment variable sandboxing (env), and standard
      stream capture (stdio) with automatic LIFO restoration. Spec:
      docs/specs/0009-standard-fixtures-std.md. STATUS (2026-10-05): complete.
      Unit coverage in packages/std/tests/std.test.ts; dogfooded in the core
      suite via packages/bun-fixture/tests/fixtures.ts (stdFixtures merged) and
      packages/bun-fixture/tests/std.test.ts, which proves engine-driven
      teardown: fresh tmpdir per test with the previous wiped, process.env
      restored, real streams handed back. Note: the dogfood import resolves via
      the workspace node_modules symlink and is deliberately not declared in
      packages/bun-fixture devDependencies - std already dev-depends on
      bun-fixture for FixtureDef types, and the reverse edge makes Turbo's task
      graph cyclic."
    source_links: []
    status: done
    priority: P1
    labels:
      - std
      - fixtures
    repo_targets: []
    acceptance_criteria:
      - tmpdir fixture creates isolated directory with helper methods (write,
        read, exists) and wipes on teardown
      - env fixture sandboxes process.env modifications and guarantees full
        restoration on teardown
      - stdio fixture captures stdout/stderr writes without leaking output and
        restores streams on teardown
      - Dogfooded in packages/bun-fixture test suites
    dependencies:
