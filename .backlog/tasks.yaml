  - id: task_018
    title: Rename bun-fixture to bun-test-utils AND consolidate to a single
      published package (new ADR superseding ADR 0011)
    description: >-
      RESOLVED across two grill-me sessions on 2026-10-05. Session 1 confirmed
      the name (bun-test-utils / @bun-test-utils/*) with the six existing
      packages kept separate and published independently. Session 2 REVERSED the
      separate-packages half: there is no longer an 'ecosystem of independently
      published companion packages.' Both halves of ADR 0011 ('Brand Identity
      and Modular Ecosystem Architecture') are now reversed, not just the name:


      1. Name: bun-fixture -> bun-test-utils (unchanged from session 1).

      2. Architecture: ADR 0011's 'microkernel + modular ecosystem of
      independently published companion packages' (std, fast-check, dom,
      browser, vcr, snapshot each as its own npm package) is replaced by:
      exactly ONE published npm package, bun-test-utils, containing the core
      engine plus every capability bundled in as a flat subpath export
      (bun-test-utils/std, bun-test-utils/vcr, bun-test-utils/dom,
      bun-test-utils/browser, bun-test-utils/pbt, bun-test-utils/snapshot,
      bun-test-utils/bdd). The six existing packages (plus the new bdd package,
      see ADR 0012/spec 0014) become internal, unpublished (private: true) Bun
      workspace packages used only for source organization and dependency
      isolation; they are never published to npm on their own. The actual
      fold/bundle-pipeline work is task_020, not this task.

      2a. Naming (2026-10-05, later decision): the `fast-check` package/subpath
      is additionally renamed to `pbt` (Property Based Tests) — directory
      packages/fast-check -> packages/pbt, package.json name
      @bun-fixture/fast-check -> @bun-test-utils/pbt, eventual subpath
      bun-test-utils/pbt. This only renames OUR package; the underlying
      third-party `fast-check` library dependency and its own API are unchanged
      and still called `fast-check`. Update packages/pbt's package.json
      description/keywords, its README/CHANGELOG, test file names
      (tests/fastcheck.test.ts -> tests/pbt.test.ts or similar), and every
      cross-reference in root README.md, apps/docs (guides/
      property-based-testing.md, reference/api.md, reference/plugins.md),
      tsconfig.json path aliases, and packages/bun-fixture's own
      plugin.ts/pack.test.ts references to @bun-fixture/fast-check.


      THIS task's scope is the naming half plus the ADR:

      - New ADR superseding ADR 0011, recording BOTH reversed decisions (rebrand
      + architecture) with rationale: nothing is published yet under any name,
      so there is zero backward-compat cost to changing either; one install
      target removes version-skew and cross-package-discovery overhead for
      consumers; heavy per-capability deps (playwright, happy-dom, fast-check)
      become optionalDependencies/peerDependenciesMeta.optional on the single
      package instead of being forced via separate package installs.

      - Rename the core package directory/package.json: packages/bun-fixture ->
      packages/bun-test-utils.

      - Rename every existing workspace package's package.json 'name' field
      (@bun-fixture/* -> @bun-test-utils/*) — this is now purely an
      internal/cosmetic workspace-linking identifier since none of them publish
      standalone; actual bundling into one artifact happens in task_020.

      - Update every hardcoded string literal referencing the old name (error
      message prefixes like '[bun-fixture] ...', the CLI's generated bunfig.toml
      preload path, scaffolded fixtures.ts comments) — decide rename vs
      keep-for-compat for the BUN_FIXTURE_ROOT / BUN_FIXTURE_NO_AUTODISCOVER env
      vars.

      - Root tsconfig.json path aliases, bunfig.toml preload entries,
      turbo.json/biome.json references to old package names.

      - Root README.md and apps/docs Starlight site (title/description/site
      config, astro.config.mjs 'site'/'base') updated for the new name — note:
      once task_020 lands, the six per-package docs pages collapse into one
      package's docs with per-subpath sections, so don't over-invest in
      polishing six separate READMEs here; a short 'renamed, restructuring in
      task_020' stub is enough for now.

      - GitHub repository rename (Archont561/bun-fixtures -> matching new name)
      and git remote URL update — still the repository owner's manual action,
      not something the agent performs unilaterally. package.json
      'repository'/'homepage'/'bugs' fields update accordingly once the owner
      confirms the new repo URL.

      - Full lint + typecheck + test + docs:build green after the rename.


      Sequencing: task_018 (this, naming settled) -> task_020 (fold into one
      published package) -> BDD bridge built directly as packages/bdd, folded in
      by task_020 -> task_019 (conformance tests against final subpath exports)
      -> task_016 (publication-readiness audit of the single final artifact) ->
      M5 publish, no fixed cutoff.
    source_links: []
    status: done
    priority: P1
