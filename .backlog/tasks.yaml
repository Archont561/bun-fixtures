  - id: task_031
    title: Deflake pack.test.ts bunup ENOENT on dist/plugin.js
    description: "RESOLVED 2026-10-06 via squash commit 7ff9426. Two failures shared
      one symptom: (1) turbo's test pipeline never built the public wrapper,
      whose suite self-references the bunup dist — deterministic failure on any
      fresh/cold machine (5/5 reproduced locally, previously masked because
      prepare builds dist at install); fixed by making bun-test-utils#test
      depend on its own build in turbo.json. (2) The pack harness's bun pm pack
      re-ran a full bunup rebuild inside the test phase over the live dist and
      intermittently crashed bunup with an internal ENOENT (~50% on PRs #12/#13;
      never reproduced sequentially, 12/12 clean); fixed by packing with
      --ignore-scripts after a deterministic README sync. Proof: PR #13 Test
      pass; post-merge main CI green; six consecutive local cold-state turbo run
      test runs green."
