  - id: task_019
    title: "Cross-package conformance testing: verify internal capabilities compose
      through root API (vcr + std + bdd and beyond)"
    description: >-
      Depends on task_018 (rename) and task_020 (fold into one bun-test-utils
      package with root capability integration) landing first.


      Every capability in bun-test-utils (std, pbt, dom, browser, vcr, snapshot,
      bdd) is tested in isolation inside its own internal workspace package:
      each one's own tests/ directory calls its own fixtures.setup() directly
      against a scratch FixtureContext, never through a shared engine instance
      alongside sibling capabilities. Nothing today proves that multiple
      capabilities actually compose correctly when a real consumer imports
      several of them (VCR, std, BDD-style scenarios, ...) into one explicit
      fixture maps under the real engine (shared scope cache, correct
      cross-capability LIFO teardown order, no name collisions, no
      double-instantiation of a dependency two capabilities both pull in).


      Add a dedicated conformance test suite
      (packages/bun-test-utils/tests/conformance/) that runs real test() cases
      against explicit test.extend() chains combining multiple capabilities'
      FixtureMaps via the real public path (not direct fixture.setup() calls)
      and via the real root bun-test-utils import (not internal
      workspace-relative imports), proving they interoperate as real
      published-package consumers would use them together.


      MINIMUM MATRIX:

      - vcr + std: a cassette fixture recording/replaying into a path derived
      from std's tmpdir fixture (cross-capability data dependency), proving
      teardown order and that both capabilities' fixtures resolve from one
      merged FixtureMap without name collisions.

      - vcr + bdd: a Cucumber Given/When/Then step (via the internal BDD-style
      scenario support) requesting the root cassette fixture, proving
      record/replay works identically whether requested from test() or from a
      BDD step.

      - std + bdd: env/stdio/tmpdir fixtures requested from a BDD step, proving
      sandboxing and restoration still happen correctly outside a test()
      wrapper.

      - vcr + std + bdd together: one three-way scenario combining all three in
      a single explicit fixture module.

      - At least one negative case: two explicit fixture maps declaring a
      fixture with the same name, proving imported test.extend() order controls
      overrides and sibling directories do not contribute fixtures implicitly.


      Also worth covering while in there (not required for the minimum bar, note
      as follow-up if descoped): dom + browser (happy-dom globals vs real
      Playwright context coexisting, blocked on task_013), pbt + vcr
      (property-based test driving cassette replay per sample, using the
      fast-check library via the root test.prop() API).


      Wire the new suite into turbo.json / root package.json test script and CI
      so it runs on every push/PR like the existing pack.test.ts smoke test.
