  - id: task_041
    title: Release stability tiers, context-key policy, and error-message contract
    description: "Define and enforce the public stability story before the first npm
      release. (1) Stability tiers: core, std, dom, snapshot, pbt, and a minimal
      vcr surface are stable; browser (Playwright peer, heaviest CI path) and
      bdd (rides third-party @aboviq/bun-test-cucumber 0.x) are labeled
      experimental, with a one-sentence semver policy in the README stating
      experimental capabilities may change in minor versions. (2) vcr surface
      freeze: record/replay plus one simple matcher only; matching DSLs,
      redaction, and cassette migration are explicitly deferred — growing vcr
      later is safe, shrinking it is breaking. (3) Context-key collision policy:
      the wrapper injects ~19 fixture names (page, env, snapshot, ...) into one
      flat test.extend namespace; document and test precedence when a consumer
      defines the same key. (4) Error-message contract: e2e steps already assert
      exact strings (unknown fixture, circular fixture dependency, finished
      without calling use(value)); enumerate which messages are contractual and
      lock them with a snapshot/conformance test. (5) Declare platform support:
      Linux/macOS now, Windows post-release (scratch harness and presets rely on
      POSIX URL.pathname)."
