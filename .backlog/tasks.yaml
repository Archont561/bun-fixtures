      - The schema is versioned and documented in a numbered spec under
        .backlog/docs/specs/, and the config surface is assigned a stability
        tier under ADR 0018 before release.
      - Per-test fixture methods (networkGuard.allow, seed.set,
        cassette.setMode/redactHeader/save/load) remain the supported per-test
        path; the config surface only sets project-wide defaults.
