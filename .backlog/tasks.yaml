  - id: task_012
    title: Support Property-Based Testing (PBT) via fast-check integration (test.prop)
    description: "Integrate fast-check Arbitraries with fixture dependency
      injection, supporting test.prop with shrink-aware LIFO fixture teardown
      between iterations. Spec:
      docs/specs/0010-property-based-testing-fastcheck.md. STATUS (2026-10-05):
      complete. The engine grew an opt-in iteration protocol: test(name, fn, {
      iterate: true }) defers test-scoped fixtures behind ctx.iterate(fn), which
      builds them fresh per call and unwinds them LIFO (session/file instances
      stay shared); opted-in wrapper contexts hold eager session/file values
      only. prop() runs every fc.assert sample - including shrink candidates -
      through ctx.iterate, auto-detects requested fixtures from the test
      function's destructured first parameter (or opts.fixtures), and the
      top-level prop resolves the calling test file per call via the newly
      exported callerFile (module-scope binding pinned the wrong file). Engine
      dogfood tests cover the protocol (freshness, LIFO, teardown-on-throw);
      packages/fast-check/tests covers per-iteration recreation, session/file
      preservation, and no-leak shrink teardown. All four acceptance criteria
      verified."
    source_links: []
    status: done
    priority: P2
    labels:
      - pbt
      - fast-check
    repo_targets: []
    acceptance_criteria:
      - test.prop API combines fast-check arbitraries with injected fixtures
      - Session/file fixtures preserved across iterations while test/iteration
        fixtures cleanly recreate or reset
      - Shrink cycles properly execute fixture teardown without leaking state
      - Full test coverage with example property test suites
    dependencies:
