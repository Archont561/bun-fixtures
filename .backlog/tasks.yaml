      FOLLOW-UP USER DECISION (2026-10-08, later): The user approved
      `defineArbitraries` as the PBT identity helper name, replacing the
      unreleased name `propTestSchema`. Do not retain a compatibility alias.
      This is a naming-only change; the BDD wrappers, type surfaces, and root
      API remain as recorded in ADR 0022. ADR 0023 records the naming decision
