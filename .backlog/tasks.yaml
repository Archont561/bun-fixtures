  - id: task_066
    title: v0.1.0 npm Trusted Publishing failed; trusted publisher registered with
      environment none
    description: >-
      Rewritten 2026-10-09 after the v0.1.0 release was attempted and failed.
      The

      original finding is kept below with each claim marked, because part of it
      was

      right and part is now disproved.


      WHAT HAPPENED (verified through `gh api` on 2026-10-09):

      - Run 37860324252, event push, tag v0.1.0, created 2026-10-08T23:35:57Z,
        conclusion failure:
        https://github.com/Archont561/bun-test-utils/actions/runs/37860324252
      - Job 113594388340 "Publish to npm" failed at the step "Publish with npm
        Trusted Publishing" (23:36:35Z-23:37:05Z). Every earlier step succeeded,
        including "Create release tarball" and "Upload release tarball", so the
        release-tarball artifact exists (30-day retention).
      - "Publish to GitHub Packages" succeeded; "Create GitHub Release"
        (job 113594562927) was skipped, so there is no GitHub Release.
      - `git ls-remote --tags origin` returns no tags: the v0.1.0 tag has been
        deleted. npm's dist-tags.latest is 0.0.0 and the only published versions are
        0.0.0-stage and 0.0.0, so 0.1.0 never reached npm.

      LEADING CAUSE (sourced from this task's own earlier note, not yet
      confirmed

      against npmjs.org): the trusted publisher was registered with
      `environment:

      none` while release.yml declares `environment: npm` on the publish job.
      npm

      matches the OIDC claim's environment, so a mismatch is rejected at exactly
      the

      step that failed. Fix either side: register the publisher with environment

      `npm`, or drop `environment: npm` from the job.


      RULED OUT by reading .github/workflows/release.yml: `id-token: write` is

      granted at workflow level (line 36) and publish-npm declares no job-level

      `permissions:` block narrowing it, so the OIDC token was available;

      NODE_VERSION is 24.x, so npm is >= 11.5.1 and supports trusted publishing.


      STILL OPEN FROM THE ORIGINAL FINDING: the gating decision. `gh api
      .../environments/npm`

      and `.../environments/release` both return `"protection_rules": []`. The

      original text is right that if the intent was "a human approves every npm

      publish", the workflow as written walks around the gate built for it.


      UNBLOCKED SINCE: the upload glob is already
      `archont561-bun-test-utils-*.tgz`

      with `if-no-files-found: error`, and that step succeeded in the failed
      run, so

      the rename worry in the original note is done.


      NOT YET CAPTURED: the failing step's error text. `gh run view
      --log-failed` is

      unreachable from the agent sandbox

      (results-receiver.actions.githubusercontent.com is not allowlisted) and
      the

      job's annotations carry only Node 20 deprecation warnings. Read it in the

      Actions UI and quote it here.


      Re-running needs a tag: release.yml triggers on `v*.*.*` tags or

      workflow_dispatch with an existing tag, and per .changeset/README.md a
      release

      is a `v<version>` tag on a commit on `main`. `publish sandbox`

      (.github/workflows/publish-sandbox.yml) is pixi-sandbox generated and
      unrelated

      to the npm release path.


      ORIGINAL FINDING (2026-10-08), claim by claim:

      - "the repository's environments are `github-pages` and `release` - there
      is no
        `npm`" -> DISPROVED. `gh api repos/Archont561/bun-test-utils/environments`
        now returns `github-pages`, `npm`, `release`. The `npm` environment's
        created_at is 2026-10-08T23:36:31Z, four seconds before the publish job
        started (23:36:35Z), so its existence is GitHub's implicit creation on first
        reference and says nothing about npm's side.
      - "GitHub auto-creates a referenced environment on first use, in which
      case the
        publish works but is NOT gated by anything" -> half CONFIRMED: it was
        auto-created and nothing gates it, but the publish did not work.
      - "It does not, in which case the very first publish job fails to start"
      ->
        DISPROVED; the job started and ran to the publish step.
      - ".changeset/README.md must agree with the mechanism" -> satisfied: it
      already
        says "Trusted Publishing, environment `npm`".
      - "Resolve BEFORE the first real publish, not during it" -> overtaken; the
        first publish was attempted on 2026-10-08 and failed.

      Related: task_005 (M5) stays in_progress until npm carries 0.1.0, the tag

      exists again, and the installed-consumer harness is rerun.
    source_links: []
