    acceptance_criteria:
      - "The trigger is met and recorded: a named consumer needs per-workspace
        settings in one bun test invocation, which env vars cannot express."
      - A new ADR decides the delivery mechanism before any code, ranking the
        bunfig [test.bunTestUtils] section against an explicit configure() call
        and a discovered config file, and supersedes or amends nothing silently.
      - If the bunfig section is chosen, Bun's tolerance of unknown bunfig keys
