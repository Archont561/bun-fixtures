  - id: task_048
    title: "Reusable definition libraries: composable fast-check arbitraries and
      shared scenario steps"
    description: >
      Make definitions first-class reusable across files for the two expressive
      APIs. Both halves are additive; both already work at runtime today, so the
      deliverable is typing, composition ergonomics, documentation, and tests —
      not new machinery.


      MEASURED INVENTORY (2026-10-07, after ADR 0020 removed params):

      PBT SCHEMAS — a schema today is an inline record or factory passed to
      test.prop: ArbitraryInput<T> = T | ((fc: FastCheckApi) => T), with
      FastCheckApi = Record<string, any> (packages/pbt/src/index.ts:95-108).
      Nothing binds a schema to a file or test, so exporting the factory from a
      shared module already works at runtime — nothing tests or documents it.
      The friction is typing: because `fc` is `any`, generated values widen to
      `unknown` at the call site —
      packages/bun-test-utils/tests/conformance/style-matrix.test.ts needs
      `segments as string[]` and `value as string` casts (lines 38-40, 79-80).
      test.scenario.prop types its strategies as Record<string, unknown> |
      ((tools: any) => Record<string, unknown>)
      (packages/core/src/types.ts:161-166) — no typing at all. Spec 0004 R8
      forbids `any` leaking into public signatures, so this is
      contract-relevant, and spec 0010 R1 is the home requirement.

      BDD STEPS — a step today is a plain callback on the fluent chain; fixtures
      are auto-detected per step (steps.flatMap((step) =>
      detectFixtures(step.fn, 0)) in scenarioFactory,
      packages/core/src/plugin.ts:618-690), so a step defined in another module
      already gets its fixtures resolved without the scenario listing them.
      Missing: exported step types (ScenarioContext exists; a Given/When/Then
      step alias does not), so a shared step is hand-typed against a context
      slice and nothing checks it composes with the chain that uses it. No way
      to reuse a sequence of steps (an "authenticated admin" prefix) without
      repeating the calls. Step names never reach the test name or failure
      output — makeTest is called with the scenario title only
      (plugin.ts:646-676) — so reuse has no reporting story. The scenarios guide
      (apps/docs/src/content/docs/guides/scenarios-and-fluent-api.md) documents
      inline steps only. Repo-internal Gherkin steps are already shared
      repo-wide by glob discovery (spec 0015, ADR 0017) — that is NOT the gap,
      and parsing/running .feature files stays a permanent non-goal
      (caveats.md).


      SHARED DESIGN QUESTION — where does a definition live? Decide and record
      before code, because the options freeze different contracts:

      (a) TYPES-ONLY + convention: schemas and steps stay plain functions; the
      deliverable is exported types, type-level composition, docs, tests. Zero
      change to the pinned public surface — the conformance gate pins root
      runtime exports to exactly describe/expect/test, and type-only exports are
      invisible to Object.keys.

      (b) MEMBERS ON test.* (e.g. test.schema / test.steps): additive, but
      amends spec 0004 R4 and freezes more surface under ADR 0018.

      (c) NEW ROOT EXPORTS: breaks spec 0004 R2, the public-api conformance
      gate, and ADR 0012 — needs a superseding ADR.

      RECOMMENDATION: (a). Both features already work at runtime; what is
      missing is types, composition ergonomics at the type level, and
      documentation. Revisit (b) only if a runtime helper earns its keep (e.g. a
      step-sequence combinator that needs to inspect steps).


      TIMING — additive either way. Landing before task_005 tag makes it part of
      0.1.0 and must be reflected in spec 0004/ADR 0018 wording; landing after
      makes it a 0.2.0 minor with the repository's first changeset. Default:
      after 0.1.0, so the release does not grow a new surface at the last
      minute. BDD is experimental (ADR 0018), so its half may ride a minor
      regardless.


      NON-GOALS — Gherkin parsing/running for consumers; implicit fixture
      discovery; a string-keyed schema/step registry with global lookup
      (definitions stay explicit imports, matching the explicit-composition
      culture of ADR 0005/0008).


      IMPLEMENTATION HANDOFF (2026-10-07): The initial types-only version of the
      source, tests, guides, and package READMEs was implemented and validated.
      The user-approved direction was settled before implementation, but the
      spec note itself was added after source/test edits began. The acceptance
      criterion requiring the design note to predate code was not met in
      repository chronology.


      FOLLOW-UP USER DECISION (2026-10-08): The user first authorized one
      top-level runtime identity wrapper, `propTestSchema`, so shared schema
      factories receive contextual fast-check typing without importing the type
      in each schema file. ADR 0021 records that intermediate revision before
      its source edits.


      FOLLOW-UP USER DECISION (2026-10-08, later): The user requested a strict
      move to capability-scoped typed helper subpaths. `propTestSchema` belongs
      at `bun-test-utils/pbt`; `givenStep`, `whenStep`, and `thenStep` plus the
      scenario type aliases belong at `bun-test-utils/bdd`. Remove the helper
