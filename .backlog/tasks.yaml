  - id: task_019
    title: "Cross-package conformance testing: verify subpath exports compose (vcr +
      std + bdd and beyond)"
    description: >-
      Depends on task_018 (rename) and task_020 (fold into one bun-test-utils
      package with subpath exports) landing first.


      Every capability in bun-test-utils (std, pbt, dom, browser, vcr, snapshot,
      bdd) is tested in isolation inside its own internal workspace package:
      each one's own tests/ directory calls its own fixtures.setup() directly
      against a scratch FixtureContext, never through a shared engine instance
      alongside sibling subpaths. Nothing today proves that multiple subpaths
      actually compose correctly when a real consumer imports several of them
      (bun-test-utils/vcr, bun-test-utils/std, bun-test-utils/bdd, ...) into one
      real fixtures.ts under the real engine (shared scope cache, correct
      cross-subpath LIFO teardown order, no name collisions, no
      double-instantiation of a dependency two subpaths both pull in).


      Add a dedicated conformance test suite
      (packages/bun-test-utils/tests/conformance/) that runs real test() cases
      against fixtures.ts files combining multiple subpaths' FixtureMaps via the
      real preload/discovery path (not direct fixture.setup() calls) and via
      real bun-test-utils/<name> subpath imports (not internal
      workspace-relative imports), proving they interoperate as real
      published-package consumers would use them together.


      MINIMUM MATRIX:

      - vcr + std: a cassette fixture recording/replaying into a path derived
      from std's tmpdir fixture (cross-subpath data dependency), proving
      teardown order and that both subpaths' fixtures resolve from one merged
      FixtureMap without name collisions.

      - vcr + bdd: a Cucumber Given/When/Then step (via the bun-test-utils/bdd
      subpath's withFixtures bridge) requesting the cassette fixture from
      bun-test-utils/vcr, proving record/replay works identically whether
      requested from test() or from a BDD step.

      - std + bdd: env/stdio/tmpdir fixtures requested from a BDD step, proving
      sandboxing and restoration still happen correctly outside a test()
      wrapper.

      - vcr + std + bdd together: one three-way scenario combining all three in
      a single feature file/fixtures.ts.

      - At least one negative case: two fixtures.ts files declaring a fixture
      with the same name in sibling directories, proving the documented
      nearest-wins merge behaviour still holds when the colliding fixtures come
      from different subpaths, not just hand-written test fixtures.


      Also worth covering while in there (not required for the minimum bar, note
      as follow-up if descoped): dom + browser (happy-dom globals vs real
      Playwright context coexisting, blocked on task_013), pbt + vcr
      (property-based test driving cassette replay per sample, using the
      fast-check library via the pbt subpath).


      Wire the new suite into turbo.json / root package.json test script and CI
      so it runs on every push/PR like the existing pack.test.ts smoke test.
