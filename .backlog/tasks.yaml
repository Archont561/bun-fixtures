  - id: task_059
    title: openFixtures leaks already-built fixtures when a later setup throws
    description: "openFixtures in packages/core/src/plugin.ts builds fixtures in
      dependency order and collects their teardowns on a local stack, but
      unwinds that stack only through the returned close(). When a later
      fixture's setup throws, openFixtures rejects without unwinding, so
      teardowns of fixtures already built never run. Confirmed by probe: fixture
      a builds, then fixture b throws in setup; the events are [a:setup,
      b:setup-throws] and a:teardown never runs. The existing caller in
      packages/core/tests/error-messages.test.ts only checks the single-fixture
      message, and the teardown characterization added in task_058
      (packages/core/tests/plugin.test.ts) does not exercise this path, so no
      test covers the leak. Fix: unwind what was built before rethrowing the
      original setup error. Done: openFixtures unwinds the test-scoped fixtures
      it built before rethrowing a setup failure. Red first: three tests in
      packages/core/tests/plugin.test.ts (fixture teardown block) failed on the
      old code: the two-fixture probe case (a:teardown missing), LIFO across
      three fixtures (both teardowns missing), and a cleanup case where the
      remaining teardowns did not run. Green: plugin.test.ts 31 of 31,
      error-messages.test.ts 3 of 3, core package 132 of 132. Decision: a
      teardown error during failure cleanup is dropped, so the setup error stays
      the rejection; the setup error is the first failure, so it wins. The
      regular test path does the opposite, recorded as task_063. Unchanged:
      file- and session-scoped fixtures stay engine-owned and are torn down at
      teardownFile or teardownSession; a probe confirmed the file-scoped
      teardown runs at teardownFile, not at the failed open. Suite: bun test 370
      pass, 8 skip (Playwright not provisioned), 0 fail across 378 tests in 48
      files (was 367/8/0, 375 tests); lint 138 files clean; typecheck 19 of 19;
      build 10 of 10."
    source_links: []
    status: done
    priority: P2
