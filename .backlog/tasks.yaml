  - id: task_069
    title: "Restored browser bundle: binaries keep the restore staging prefix, so
      Xvfb needs a repair"
    description: "pixi-sandbox restore rewrites text files only. Binaries keep the
      path they were built under, .pixi/.restore-work/stage-browser/browser, and
      Xvfb needs that path to resolve (its keymap compiler and xkb data live
      there). About 250 binaries in the bundle carry the staging prefix. Without
      the repair in scripts/browser-activate.sh, Xvfb exits with \"Failed to
      compile keymap\"; with it, headed Chromium renders
      (packages/browser/tests/headed-chromium.test.ts). Upstream: pixi-sandbox
      v0.6.0 is the latest release. Issue #18 (closed 2026-09-28) covered text
      files only and skipped binaries, and its maintainer comment calls ELF
      prefixes not load-bearing, which the Xvfb evidence contradicts. Next: file
      an upstream issue with the Xvfb reproduction (needs the user's approval),
      then drop the staging repair once restore relocates binaries."
