  - id: task_020
    title: Fold all ecosystem packages into the single bun-test-utils package
      (internal workspace packages + subpath exports)
    description: >-
      Executes the architecture reversal recorded in the ADR superseding ADR
      0011 (authored in task_018): there is exactly ONE published npm package,
      bun-test-utils; every capability is an internal, unpublished (private:
      true) Bun workspace package bundled into it. Depends on task_018 (names
      must be settled first).


      SCOPE:

      - Convert packages/std, pbt (renamed from fast-check in task_018), dom,
      browser, vcr, snapshot (post task_018 rename, @bun-test-utils/* internal
      names) to private: true workspace packages — remove any standalone
      npm-publish metadata (public LICENSE duplication, standalone README framed
      as an npm landing page, publishConfig) since they no longer ship on their
      own.

      - New internal packages/bdd workspace package (per ADR 0012 / spec 0014),
      built the same way as the others from day one — it should never exist as a
      standalone-publishable package at all.

      - Build pipeline inside packages/bun-test-utils that compiles/bundles each
      internal package's source into packages/bun-test-utils/dist/<name>/, wired
      through an 'exports' map on the published package.json producing FLAT
      subpath imports: bun-test-utils/std, bun-test-utils/vcr,
      bun-test-utils/dom, bun-test-utils/browser, bun-test-utils/pbt,
      bun-test-utils/snapshot, bun-test-utils/bdd (plus the bare bun-test-utils
      entrypoint for the core engine). Types must resolve correctly per subpath.

      - Heavy per-capability deps (playwright for browser, happy-dom for dom,
      the fast-check library for the pbt subpath, bdd's
      @aboviq/bun-test-cucumber, vcr/snapshot's own deps if any) become
      optionalDependencies + peerDependenciesMeta.optional entries on the single
      bun-test-utils package.json. Importing a gated subpath without its peer
      dep installed MUST throw a clear, actionable error naming the missing
      package and the install command — never a silent crash or an unhelpful
      stack trace from deep inside the bundle.

      - CLI (bunx bun-test-utils init or equivalent) and every docs instruction
      updated from 'bun add @bun-fixture/vcr' style to single-package-install +
      subpath-import style ('bun add bun-test-utils' once, then 'bun add
      playwright' only if using the browser subpath, etc.).

      - Consolidate the six-plus-one separate package READMEs into one README
      with a clear section per subpath — merge useful content, don't just delete
      it; historical per-package CHANGELOGs can stay as internal changelog notes
      but are no longer npm-facing.

      - apps/docs Starlight site: every per-package reference page's install
      instructions updated to the single-package + optional-peer-dep pattern.

      - pack.test.ts (or equivalent publishable-package smoke test) updated:
      asserts exactly one package (bun-test-utils) is publishable; every
      internal workspace package asserts private: true and must never appear in
      any npm-publish step or CI publish matrix.

      - CI: collapse any per-package publish step into a single publish step for
      bun-test-utils.

      - Full lint + typecheck + test + docs:build green with the new
      single-artifact shape.
