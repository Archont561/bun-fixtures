  - id: task_045
    title: Opt-in base directory for the cassette and snapshot conventions
    description: "DECIDED AND PARKED - see ADR 0019
      (.backlog/docs/adr/0019-no-base-directory-override-in-0-1-x.md). The task
      asked to decide first whether the real gap is an opt-in base-directory
      override or simply exporting createTest from the wrapper. Measured against
      the contracts already frozen for 0.1.0, the answer is neither, and 0.1.0
      ships without both. Exporting createTest is blocked outright by spec 0004
      R7 ('engine helpers MUST NOT be re-exported from the public root
      package'), also violates R2, breaks the public-api.test.ts conformance
      gate pinning root exports to exactly describe/expect/test, and would
      reverse ADR 0012. The baseDir override is not blocked but is badly timed:
      ADR 0018 declared snapshot and minimal VCR stable for 0.1.x, so shipping
      baseDir makes its removal a breaking change, and spec 0013 R4
      (snapshot.path read-only, snapshots next to the test file) would need
      amending in the same breath it was frozen. task_037 already measured the
      demand as 'the test suite only'. TRIGGER THAT UNPARKS IT: a consumer
      outside this repository needs to redirect the convention and cannot do so
      via cassette.save()/load() or by choosing where the test file lives. If
      that fires, baseDir is the path - additive - not exporting createTest,
      which would widen the root surface permanently. Recorded in the root
      README roadmap and in ADR 0019's alternatives, including the smaller
      intermediate step (give snapshot a save/load pair mirroring vcr)."
