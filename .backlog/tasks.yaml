  - id: task_065
    title: cassette.record silently corrupts callback values JSON cannot round-trip
    description: >-
      Measured on 2026-10-08 against the built package (scratch project,
      VCR_MODE=record, record then replay of one callback per value shape).
      serializeOutput in packages/vcr/src/cassette.ts:83 is JSON.stringify with
      a bigint replacer, and deserializeOutput is JSON.parse, so anything JSON
      does not round-trip comes back wrong with no warning:


      | recorded        | replayed           | failure mode            |

      |-----------------|--------------------|-------------------------|

      | plain object    | correct            | —                       |

      | undefined       | correct            | special-cased           |

      | Date            | string             | silent type loss        |

      | BigInt          | "123n" (string)    | silent type loss        |

      | NaN / Infinity  | null               | silent corruption       |

      | class instance  | plain object       | silent prototype loss   |

      | Map             | {}                 | SILENT DATA LOSS        |

      | Set             | {}                 | SILENT DATA LOSS        |

      | Error           | {}                 | SILENT DATA LOSS        |

      | circular        | raw TypeError: JSON.stringify cannot serialize cyclic
      structures. (no code, no [bun-test-utils/vcr] prefix) | loud but unbranded
      |


      Seven of the ten rows come back wrong with no warning, and three of those
      come back literally empty. The record run passes, so the failure is
      invisible at record time, and every replay of that callback returns the
      corrupted value.


      Correction (2026-10-09, reproduced on main): the callback result never
      reaches the cassette file. The callback registry is in memory per test and
      save() writes only HTTP entries, so the corruption stays inside the test
      that recorded the value; a later test that replays the same callback gets
      CALLBACK_NOT_RECORDED. The first record call returns the live value. Only
      replays are wrong.


      Same mechanism, same rule, also measured: nested undefined (key dropped),
      -0 (replays as 0; bun:test toEqual tells them apart), RegExp and typed
      arrays (become {} or index-keyed objects), nested functions and
      symbol-keyed properties (dropped), sparse array holes (become null).


      Why it is release-relevant: spec 0012 R4 puts
      record(callback)/replay(callback) in the STABLE surface, promising "the
      recorded serializable result". A Map is serializable in any ordinary
      sense.


      Scope note: this is NOT task_050. task_050 designs reversible, versionable
      serializers — an extension point and an on-disk format, i.e. a public
      contract. That work can wait: spec 0012 R2 already declares "The on-disk
      schema is not yet a stable public format", so there is no compatibility
      reason to rush it into 0.1.0. This task is the smaller, prior question: a
      value that cannot round-trip must be REFUSED loudly rather than quietly
      corrupted. Whether such values should instead be SUPPORTED is task_050's
      design decision; the refuse-only decision is recorded in ADR 0026.


      Minimum fix: make serializeOutput detect values it cannot round-trip and
      throw a named BunTestUtilsError; wrap the circular-structure TypeError so
      it carries a code and the [bun-test-utils/vcr] prefix like every other
      diagnostic.


      Decision (ADR 0026, 2026-10-09): refuse-only, with the code
      CALLBACK_NOT_SERIALIZABLE and one plain-data rule covering every shape
      above. Callback identity keyed on source text is a separate defect:
      task_067.
    source_links: []
    status: done
    priority: P2
    labels:
      - vcr
      - bug
    repo_targets:
      - bun-test-utils
    acceptance_criteria:
      - a Map, Set, Error, BigInt, Date, NaN/Infinity or class instance is
