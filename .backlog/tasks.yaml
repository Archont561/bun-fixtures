  - id: task_067
    title: cassette.record keys callbacks by source text, so closures from one
      factory share a registry entry
    description: "Found while testing task_065 (2026-10-09). callbackIdentity in
      packages/vcr/src/cassette.ts keys a callback by its source text (fnv1a of
      Function.prototype.toString plus its length), without executing it. Two
      closures created by one factory have identical source text, so they share
      one registry entry. Verified: const makeLoader = (id) => () => ({ id });
      await cassette.record(makeLoader('a')); await
      cassette.record(makeLoader('b')) returns { id: 'a' } for the second call,
      and the second closure's body never runs, so the wrong value is returned
      with no warning. The first record call of the second closure returns the
      first closure's result. Stable surface: spec 0012 R4 promises the recorded
      result for record(callback). Needs a design decision first (how a
      callback's identity is derived without executing it, e.g. an explicit key
      or a hash of the captured values), recorded as an ADR before any
      implementation."
