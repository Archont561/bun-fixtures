  - id: task_042
    title: "Post-release parking lot: fixtures and techniques deferred by design"
    description: "Deliberately deferred work, parked so it is a decision rather than
      an omission. Each item carries the trigger that unparks it; nothing here
      ships as a supported API in 0.1.0, and anything promoted off the list gets
      its own task with full acceptance criteria before code is written. NOT
      IMPLEMENTED AT ALL (verified by grep over packages/*/src): database
      fixture (tmp bun:sqlite) - trigger: user demand; public
      CLI/scratch-project runner fixture productizing e2e/bdd/support/project.ts
      - trigger: user demand; filesystem sandbox beyond tmpdir - trigger: demand
      not met by the tmpdir fixture; worker/concurrency-scoped fixtures -
      trigger: Bun test parallelism semantics stabilize, since session scope
      assumes a single process; Windows support - trigger: POSIX URL.pathname
      assumptions removed from harness and BDD presets AND a Windows CI lane
      exists; VCR matcher DSL - trigger: post-release demand settles the API;
      VCR cassette migration tooling - trigger: same; mutation testing as an
      engine quality gate - trigger: engine suite needs a stronger signal than
      line coverage; fuzzing beyond fast-check - trigger: an invariant property
      testing cannot express; benchmark fixtures - trigger: a performance claim
      needs defending. SHIPS BUT OUTSIDE THE STABLE CONTRACT (correction found
      while verifying criterion 2 - the earlier wording wrongly implied these
      were absent): header redaction IS implemented as
      cassette.redactHeader(name) plus a built-in SENSITIVE_HEADERS default in
      packages/vcr/src/cassette.ts, and is usable in 0.1.0 - only its
      stable/configurable form is deferred, trigger: post-release demand settles
      the configuration shape; browser capability - trigger: Playwright peer and
      CI path prove stable; BDD capability - trigger: @aboviq/bun-test-cucumber
      reaches 1.0 or the integration is vendored. EVIDENCE for 'no parked item
      ships': the public API gate
      packages/bun-test-utils/tests/conformance/public-api.test.ts passes (3/3)
      and pins root exports to exactly describe, expect, test, so no parked
      fixture is reachable; grep over packages/*/src confirms matcher DSL and
      migration tooling are absent. VISIBILITY: the list is published as the
      'Roadmap - deliberately deferred' section of the root README, with a
      pointer from the published package README (absolute URL, since .backlog/
      is not in the npm tarball). ADDED BY task_045 (ADR 0019): base-directory
      override for the __cassettes__/__snapshots__ conventions - trigger: a
      consumer outside this repository needs to redirect the convention and
      cannot do so via cassette.save()/load() or by choosing where the test file
      lives; if it fires, baseDir is the path, not exporting createTest."
