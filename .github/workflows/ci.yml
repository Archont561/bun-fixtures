name: CI

# Parallel pipeline — `install` warms the shared Bun dependency cache, then
# the check jobs fan out and run concurrently:
#
#   install ──┬── lint
#             ├── typecheck
#             └── test
#
# Docs-only changes skip CI entirely via `paths-ignore` below.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/docs/**"
      - ".backlog/docs/**"
      - "**.md"
      - "LICENSE"
      - "LICENSE-APACHE"
      - "LICENSE-MIT"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "apps/docs/**"
      - ".backlog/docs/**"
      - "**.md"
      - "LICENSE"
      - "LICENSE-APACHE"
      - "LICENSE-MIT"
  workflow_dispatch:

# Cancel superseded runs on the same ref so queued jobs free up sooner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — this workflow only needs to read the repository.
permissions:
  contents: read

env:
  # Pinned for reproducible installs. Keep in sync with `packageManager`
  # in package.json (bun.lock is a 1.4.2-era text lockfile).
  BUN_VERSION: "1.4.2"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04 # pinned image; ubuntu-latest flips to Ubuntu 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Bun's global package cache. setup-bun leaves BUN_INSTALL unset,
          # so ~/.bun/install/cache is Bun's default location; `bun install`
          # rebuilds node_modules from here without hitting the registry.
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
            bun-${{ runner.os }}-

      - name: Install dependencies (from cache)
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bun run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
            bun-${{ runner.os }}-

      - name: Install dependencies (from cache)
        run: bun install --frozen-lockfile

      - name: Typecheck (Turborepo)
        run: bun run typecheck

  test:
    name: Test
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
            bun-${{ runner.os }}-

      - name: Install dependencies (from cache)
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Playwright's browser directory. Contents are keyed by browser
          # revision, which only moves when the pinned playwright version in
          # the lockfile changes, so the lockfile is the right cache key.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The browser fixture E2E tests (packages/browser/tests/playwright.test.ts)
      # skip gracefully without binaries; CI installs the headless shell so the
      # Playwright path is genuinely exercised on every push. Run from
      # packages/browser so bunx uses the pinned workspace playwright.
      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps chromium-headless-shell
        working-directory: packages/browser

      - name: Run tests (Turborepo + Bun Test)
        run: bun run test

      - name: Generate LCOV coverage
        run: bun run coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
